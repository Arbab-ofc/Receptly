# Replace receptly.example.com with your domain. Obtain certificates using docs/deployment.md.
server {
    listen 80;
    server_name receptly.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name receptly.example.com;
    ssl_certificate /etc/letsencrypt/live/receptly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/receptly.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/receptly/apps/web/dist;
    index index.html;
    client_max_body_size 64k;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /assets/ { expires 1y; add_header Cache-Control 'public, immutable'; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location / { try_files $uri $uri/ /index.html; }
}
